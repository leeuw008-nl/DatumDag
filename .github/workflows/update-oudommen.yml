name: Update OudOmmen articles

on:
  push:
    paths:
      - 'scripts/update-oudommen.py'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch OudOmmen WordPress posts
        run: python3 scripts/update-oudommen.py

      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- oudommen-events.json; then
            echo "Geen wijzigingen in OudOmmen-artikelen."
          else
            git add oudommen-events.json
            git commit -m "Update OudOmmen articles"
            git push
          fi

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dag van de Week</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=20261008b">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/365/365571.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dag van de Week</h1>
        </header>

        <main>
            <section class="input-section">
                <div class="input-row date-row">
                    <label>Datum</label>
                    <input type="number" id="dayInput" min="1" max="31" placeholder="Dag">
                    <select id="monthInput" aria-label="Maand"></select>
                    <input type="number" id="yearInput" min="1000" max="2100" placeholder="Jaar">
                </div>

                <div class="input-row week-row">
                    <label>Week</label>
                    <input type="number" id="weekInput" min="1" max="53" placeholder="Weeknummer">
                    <input type="number" id="weekYearInput" min="1000" max="2100" placeholder="Jaar">
                </div>

                <div class="input-row description-row">
                    <label for="descriptionInput">Omschr.</label>
                    <input type="text" id="descriptionInput"
                           placeholder="bijv. 22 januari 1967 of Koninginnedag 1955">
                    <button type="button" id="searchDescription">Zoek</button>
                </div>
                <div id="descriptionMessage" class="description-message" role="status" aria-live="polite"></div>
            </section>

            <section class="calendar-section">
                <div class="calendar-header">
                    <button id="prevMonth" aria-label="Vorige maand">‹</button>
                    <div>
                        <strong id="calendarMonth"></strong>
                        <span id="calendarWeekInfo"></span>
                    </div>
                    <button id="nextMonth" aria-label="Volgende maand">›</button>
                </div>

                <div class="weekday-header">
                    <span>ma</span><span>di</span><span>wo</span>
                    <span>do</span><span>vr</span><span>za</span><span>zo</span>
                </div>
                <div id="calendar" class="calendar"></div>
                <div id="holidayList" class="holiday-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js?v=20261008b"></script>
</body>
</html>
